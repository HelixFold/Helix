name: CI

on:
  push:
    branches: [ master ]
  pull_request:

# Linux only for now. Every platform's tests come once Helix has releases to run them with (see setup-helix).
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-helix
        with:
          macos-sdk: "true"   # the e2e projects also build for macOS

      - name: Build the compiler
        run: helix build

      - name: Run the specs with the new compiler
        run: helix build test

      - name: Check the e2e snippets with the new compiler
        run: helix build e2e
