name: Set up Helix
description: Puts helix on PATH, and with macos-sdk, Apple's SDK in SDKROOT so helix can build for macOS.

inputs:
  macos-sdk:
    description: Also install the macOS SDK
    default: "false"

runs:
  using: composite
  steps:
    # Intermediate stage: Helix has no published release yet, so the compiler comes from the archive committed in
    # .github/bootstrap: the compiler built from this repository for x86_64-linux, with only what building and testing
    # it needs - the standard library, the runtime, the prebuilt musl, clang, clang's headers, and the static LLVM,
    # libclang, and lld that the compiler links. Its lib folder is laid out as a HELIX_HOME, so the compiler that the
    # build makes finds the same LLVM and C library. Once a release is out, download it instead, e.g.:
    #   gh release download --repo HelixFold/Helix --pattern 'helix-*-x86_64-linux.tar.xz' --dir "$RUNNER_TEMP"
    # and delete .github/bootstrap.
    - name: Install Helix
      shell: bash
      # Two archives, since GitHub takes no file over 100 MB: the compiler with its lib folder, and the static LLVM
      # in lib/llvm/x86_64-linux.
      run: |
        for archive in .github/bootstrap/helix-1.0.0-alpha.0-x86_64-linux{,-llvm}.tar.xz; do
            tar -xJf "$archive" -C "$RUNNER_TEMP" --warning=no-unknown-keyword
        done
        echo "$RUNNER_TEMP/helix-1.0.0-alpha.0-x86_64-linux" >> "$GITHUB_PATH"
        echo "HELIX_HOME=$RUNNER_TEMP/helix-1.0.0-alpha.0-x86_64-linux/lib" >> "$GITHUB_ENV"

    # Building for macOS links against Apple's SDK, which Helix can't ship; helix finds it through SDKROOT.
    - name: Cache the macOS SDK
      if: inputs.macos-sdk == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/sdk
        key: MacOSX26.1.sdk-beee7212d265a6d2867d0236cc069314b38d5fb3486a6515734e76fa210c784c

    - name: Install the macOS SDK
      if: inputs.macos-sdk == 'true'
      shell: bash
      run: |
        if [ ! -d "$RUNNER_TEMP/sdk/MacOSX26.1.sdk" ]; then
            curl -fsSL https://github.com/joseluisq/macosx-sdks/releases/download/26.1/MacOSX26.1.sdk.tar.xz -o "$RUNNER_TEMP/sdk.tar.xz"
            echo "beee7212d265a6d2867d0236cc069314b38d5fb3486a6515734e76fa210c784c  $RUNNER_TEMP/sdk.tar.xz" | sha256sum -c -
            mkdir -p "$RUNNER_TEMP/sdk"
            tar -xJf "$RUNNER_TEMP/sdk.tar.xz" -C "$RUNNER_TEMP/sdk"
        fi
        echo "SDKROOT=$RUNNER_TEMP/sdk/MacOSX26.1.sdk" >> "$GITHUB_ENV"
