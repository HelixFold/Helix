name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:   # builds and checks every platform without publishing

env:
  # The prerelease whose assets hold each platform's toolchain: LLVM 23.1.4, clang and its tools, mingw-w64 for Windows.
  TOOLCHAIN: toolchain-llvm-23.1.4

jobs:
  # Every platform, which the bootstrap compiler builds with build.hx's `release` step,
  # then one archive each: helix-<version>-<platform>.tar.xz, holding the folder helix-<version>-<platform>/.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-helix
        with:
          macos-sdk: true

      # build.hx and the compiler find each platform's toolchain in $HELIX_HOME/llvm/<platform>
      - name: Install the toolchains
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TOOLCHAIN" --repo "$GITHUB_REPOSITORY" --pattern 'helix-toolchain-*.tar.xz' --dir "$RUNNER_TEMP"
          for archive in "$RUNNER_TEMP"/helix-toolchain-*.tar.xz; do
              tar -xJf "$archive" -C "$HELIX_HOME/llvm"
              rm "$archive"
          done

      - name: Build the release with the bootstrap compiler
        run: helix build release

      - name: Package
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir dist
          for dir in .helix-out/release/*/; do
              platform=$(basename "$dir")
              name=helix-$version-$platform
              tar -cJf "dist/$name.tar.xz" -C .helix-out/release --transform "s|^$platform|$name|" "$platform"
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Each platform's archive, unpacked and run on that platform.
  check:
    name: check ${{ matrix.platform }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: x86_64-linux, runner: ubuntu-24.04 }
          - { platform: aarch64-linux, runner: ubuntu-24.04-arm }
          - { platform: x86_64-macos, runner: macos-15-intel }
          - { platform: aarch64-macos, runner: macos-latest }
          - { platform: x86_64-windows, runner: windows-latest }
          - { platform: aarch64-windows, runner: windows-11-arm }
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
      - name: Unpack and run
        shell: bash
        run: |
          tar -xJf helix-*-${{ matrix.platform }}.tar.xz
          helix=$(ls helix-*-${{ matrix.platform }}/helix*)
          "$helix" version

  # A tag publishes the checked archives as a GitHub release, whose notes are written on GitHub afterwards.
  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=$([[ $GITHUB_REF_NAME == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
              --notes "" $prerelease

  # The docs of the release. A release that github.token publishes starts no other workflow, so this calls docs.yml.
  docs:
    needs: publish
    permissions:
      pages: write
      contents: write
      id-token: write
    uses: ./.github/workflows/docs.yml
