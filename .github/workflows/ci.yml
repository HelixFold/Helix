name: CI

on:
  push:
    branches: [ master ]
  pull_request:

# Linux only for now. Every platform's tests come once Helix has releases to run them with (see setup-helix).
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-helix

      - run: helix build
      - run: helix test src
