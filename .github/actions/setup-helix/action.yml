name: Set up Helix
description: Puts helix on PATH, and with macos-sdk, Apple's SDK in SDKROOT so helix can build for macOS.

inputs:
  macos-sdk:
    description: Also install the macOS SDK
    default: "false"

runs:
  using: composite
  steps:
    # Intermediate stage: Helix has no published release yet, so the compiler comes from the archives committed in
    # .github/bootstrap: the toolchain (built from this repository for x86_64-linux), and the static LLVM that a
    # program linking LLVM or libclang needs, which the compiler's own build does. Once a release is out, download
    # both instead, e.g.:
    #   gh release download --repo HelixFold/Helix --pattern 'helix-*-x86_64-linux.tar.xz' --dir "$RUNNER_TEMP"
    # and delete .github/bootstrap.
    - name: Install Helix
      shell: bash
      run: |
        tar -xJf .github/bootstrap/helix-1.0.0-alpha.0-x86_64-linux.tar.xz -C "$RUNNER_TEMP" --warning=no-unknown-keyword
        echo "$RUNNER_TEMP/helix-1.0.0-alpha.0-x86_64-linux" >> "$GITHUB_PATH"

    # The toolchain's LLVM and C library in $HELIX_HOME, where every helix looks, the one built from this repository
    # included: the static LLVM from its archive, the toolchain's own LLVM tools and clang headers, its prebuilt musl,
    # and the sources it builds other C libraries from, so nothing is downloaded
    - name: Install the toolchain's LLVM and C library
      shell: bash
      run: |
        home="$HOME/.cache/helix"
        mkdir -p "$home/llvm"
        tar -xJf .github/bootstrap/helix-llvm-1.0.0-alpha.0-x86_64-linux.tar.xz -C "$home" --warning=no-unknown-keyword
        ln -s "$RUNNER_TEMP/helix-1.0.0-alpha.0-x86_64-linux/lib/llvm/bin" "$home/llvm/bin"
        ln -s "$RUNNER_TEMP/helix-1.0.0-alpha.0-x86_64-linux/lib/llvm/lib" "$home/llvm/lib"
        ln -s "$RUNNER_TEMP/helix-1.0.0-alpha.0-x86_64-linux/lib/libc" "$home/libc"
        ln -s "$RUNNER_TEMP/helix-1.0.0-alpha.0-x86_64-linux/lib/src" "$home/src"
        echo "HELIX_HOME=$home" >> "$GITHUB_ENV"

    # Building for macOS links against Apple's SDK, which Helix can't ship; helix finds it through SDKROOT.
    - name: Cache the macOS SDK
      if: inputs.macos-sdk == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/sdk
        key: MacOSX26.1.sdk-beee7212d265a6d2867d0236cc069314b38d5fb3486a6515734e76fa210c784c

    - name: Install the macOS SDK
      if: inputs.macos-sdk == 'true'
      shell: bash
      run: |
        if [ ! -d "$RUNNER_TEMP/sdk/MacOSX26.1.sdk" ]; then
            curl -fsSL https://github.com/joseluisq/macosx-sdks/releases/download/26.1/MacOSX26.1.sdk.tar.xz -o "$RUNNER_TEMP/sdk.tar.xz"
            echo "beee7212d265a6d2867d0236cc069314b38d5fb3486a6515734e76fa210c784c  $RUNNER_TEMP/sdk.tar.xz" | sha256sum -c -
            mkdir -p "$RUNNER_TEMP/sdk"
            tar -xJf "$RUNNER_TEMP/sdk.tar.xz" -C "$RUNNER_TEMP/sdk"
        fi
        echo "SDKROOT=$RUNNER_TEMP/sdk/MacOSX26.1.sdk" >> "$GITHUB_ENV"
