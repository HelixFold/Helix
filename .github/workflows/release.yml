name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:   # builds and checks every platform without publishing

jobs:
  # Every platform, built on Linux by build.hx's `release` step into .helix-out/release/<target>.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-helix
        with:
          macos-sdk: true

      # The bootstrap's std/build installs into helix-out, so the new compiler builds itself into .helix-out first.
      - run: |
          helix build
          if [ ! -x .helix-out/bin/helix ]; then helix-out/bin/helix build; fi
          .helix-out/bin/helix build release
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: .helix-out/release/
          include-hidden-files: true   # .helix-out starts with a dot

  # Each platform's binary, run on that platform.
  check:
    name: check ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux, runner: ubuntu-24.04 }
          - { target: aarch64-linux, runner: ubuntu-24.04-arm }
          - { target: x86_64-macos, runner: macos-15-intel }
          - { target: aarch64-macos, runner: macos-latest }
          - { target: x86_64-windows, runner: windows-latest }
          - { target: aarch64-windows, runner: windows-11-arm }
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
      - name: Run
        shell: bash
        run: |
          helix=$(ls ${{ matrix.target }}/helix*)
          chmod +x "$helix"   # artifacts don't keep the executable bit
          "$helix" --help

  # A tag publishes the checked binaries as a GitHub release, one archive per platform.
  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - name: Package
        run: |
          mkdir dist
          for dir in release/*/; do
              target=$(basename "$dir")
              name=helix-$GITHUB_REF_NAME-$target
              case $target in
                  *-windows) (cd "$dir" && zip -q "$GITHUB_WORKSPACE/dist/$name.zip" helix.exe) ;;
                  *) chmod +x "$dir/helix" && tar -czf "dist/$name.tar.gz" -C "$dir" helix ;;
              esac
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  # The docs of the release. A release that github.token publishes starts no other workflow, so this calls docs.yml.
  docs:
    needs: publish
    permissions:
      pages: write
      contents: write
      id-token: write
    uses: ./.github/workflows/docs.yml
